## Production Docker Compose for VPS (Hetzner)
## Usage: docker compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: propyte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"  # Only localhost, no external access
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - propyte
    deploy:
      resources:
        limits:
          memory: 4G

  redis:
    image: redis:7-alpine
    container_name: propyte-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - propyte

  # Scraper core — runs the orchestrator, scout, and workers
  scraper-core:
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: propyte-scraper
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PROXY_DATAIMPLULSE_URL: ${PROXY_DATAIMPLULSE_URL:-}
      PROXY_BRIGHTDATA_URL: ${PROXY_BRIGHTDATA_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - propyte
    deploy:
      resources:
        limits:
          memory: 4G

  # Scheduler Daemon — replaces cron, manages all scrape scheduling
  scheduler:
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: propyte-scheduler
    command: python -m orchestrator.scheduler_daemon
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PROXY_DATAIMPLULSE_URL: ${PROXY_DATAIMPLULSE_URL:-}
      PROXY_BRIGHTDATA_URL: ${PROXY_BRIGHTDATA_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SCHEDULER_MAX_CONCURRENT: ${SCHEDULER_MAX_CONCURRENT:-3}
      SCHEDULER_POLL_INTERVAL: ${SCHEDULER_POLL_INTERVAL:-30}
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - propyte
    deploy:
      resources:
        limits:
          memory: 4G

  # Dramatiq workers (N instances for distributed scraping)
  dramatiq-worker:
    build:
      context: ./src
      dockerfile: Dockerfile
    command: python -m dramatiq orchestrator.worker_task --processes 1 --threads 1
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PROXY_DATAIMPLULSE_URL: ${PROXY_DATAIMPLULSE_URL:-}
      PROXY_BRIGHTDATA_URL: ${PROXY_BRIGHTDATA_URL:-}
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - propyte
    deploy:
      mode: replicated
      replicas: ${NUM_WORKERS:-3}
      resources:
        limits:
          memory: 2G

  # NestJS API
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: scraper-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - propyte

  # Next.js Admin Dashboard
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    container_name: scraper-admin
    restart: unless-stopped
    environment:
      API_URL: http://scraper-api:3001/api/v1
      NEXT_PUBLIC_API_URL: http://204.168.140.53/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - propyte

  # Nginx reverse proxy (public-facing)
  nginx:
    image: nginx:alpine
    container_name: propyte-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/propyte.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - admin
    networks:
      - propyte

volumes:
  pgdata:
  redisdata:

networks:
  propyte:
    driver: bridge
