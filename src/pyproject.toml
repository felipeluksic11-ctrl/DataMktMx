[project]
name = "propyte-mining"
version = "0.1.0"
description = "Data mining infrastructure for Mexican real estate listings"
requires-python = ">=3.12"
dependencies = [
    # Scraping
    "crawlee[playwright]>=0.4.0",
    "playwright>=1.45.0",
    "camoufox>=0.4.0",
    "httpx>=0.27.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "geoalchemy2>=0.15.0",

    # Task queue
    "dramatiq[redis]>=1.17.0",

    # ETL
    "pandas>=2.2.0",
    "thefuzz[speedup]>=0.22.0",

    # AI supervisors
    "anthropic>=0.30.0",

    # Utilities
    "pydantic>=2.8.0",
    "pydantic-settings>=2.3.0",
    "structlog>=24.1.0",
    "redis>=5.0.0",
    "tenacity>=8.3.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
