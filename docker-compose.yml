version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: propyte-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-propyte}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-propyte_data}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-propyte} -d ${POSTGRES_DB:-propyte_data}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - propyte

  redis:
    image: redis:7-alpine
    container_name: propyte-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - propyte

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: propyte-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-propyte}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-propyte_data}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      NODE_ENV: production
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - propyte

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://${VPS_HOST:-localhost}:3001/api/v1
    container_name: propyte-admin
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - propyte

volumes:
  pgdata:
  redisdata:
  camoufox-cache:  # Persists /root/.cache/camoufox (~713MB) across scraper container restarts

networks:
  propyte:
    driver: bridge
